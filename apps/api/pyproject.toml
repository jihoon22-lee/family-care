[project]
name = "familycare-api"
version = "0.0.0"
description = "FamilyCare HTTP API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.52.4",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familycare_api"]
