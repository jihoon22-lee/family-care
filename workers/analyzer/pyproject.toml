[project]
name = "familycare-worker"
version = "0.2.0"
description = "FamilyCare document analyzer worker"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography==50.0.0",
    "openai==3.3.1",
    "pdfplumber==0.11.10",
    "pillow==12.3.0",
    "pypdf==6.16.2",
    "pypdfium2==5.13.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
]

[project.scripts]
familycare-worker = "familycare_worker.__main__:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familycare_worker"]
