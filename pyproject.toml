[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.uv]
required-version = ">=0.12.5,<0.13"

[tool.uv.workspace]
members = ["apps/api", "workers/analyzer"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib -m 'not integration'"
testpaths = ["apps/api/tests", "workers/analyzer/tests", "scripts/tests"]
markers = [
    "integration: requires a local synthetic service such as PostgreSQL",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
