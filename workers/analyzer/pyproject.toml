[project]
name = "familycare-worker"
version = "0.0.0"
description = "FamilyCare document analyzer worker"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pdfplumber==0.11.10",
    "pypdf==6.16.2",
    "psycopg[binary]==3.3.4",
]

[project.scripts]
familycare-worker = "familycare_worker.__main__:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familycare_worker"]
