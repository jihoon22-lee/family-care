[project]
name = "familycare-api"
version = "0.1.0"
description = "FamilyCare HTTP API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.19.1",
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
familycare-admin = "familycare_api.identity.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familycare_api"]
