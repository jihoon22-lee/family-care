name: familycare

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${FAMILYCARE_DATABASE_NAME:?set FAMILYCARE_DATABASE_NAME in the env file}
      POSTGRES_USER: ${FAMILYCARE_DATABASE_USER:?set FAMILYCARE_DATABASE_USER in the env file}
      POSTGRES_PASSWORD: ${FAMILYCARE_DATABASE_PASSWORD:?set FAMILYCARE_DATABASE_PASSWORD in the env file}
    volumes:
      - type: volume
        source: familycare-postgres-data
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    image: familycare-api:dev
    build:
      context: ../..
      dockerfile: infra/containers/api.Dockerfile
    environment:
      FAMILYCARE_ENV: ${FAMILYCARE_ENV:-development}
      FAMILYCARE_DATABASE_URL: postgresql+psycopg://${FAMILYCARE_DATABASE_USER}:${FAMILYCARE_DATABASE_PASSWORD}@db:5432/${FAMILYCARE_DATABASE_NAME}
      FAMILYCARE_IMPORT_ROOT: /var/lib/familycare/import
      FAMILYCARE_SECRET_SOCKET: /run/familycare/secret.sock
    group_add:
      - "10003"
    volumes:
      - type: bind
        source: ${FAMILYCARE_IMPORT_ROOT:?set FAMILYCARE_IMPORT_ROOT outside Git}
        target: /var/lib/familycare/import
        read_only: true
      - type: volume
        source: familycare-secret-socket
        target: /run/familycare
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: familycare-worker:dev
    build:
      context: ../..
      dockerfile: infra/containers/worker.Dockerfile
    environment:
      FAMILYCARE_ENV: ${FAMILYCARE_ENV:-development}
      FAMILYCARE_DATABASE_URL: postgresql+psycopg://${FAMILYCARE_DATABASE_USER}:${FAMILYCARE_DATABASE_PASSWORD}@db:5432/${FAMILYCARE_DATABASE_NAME}
      FAMILYCARE_IMPORT_ROOT: /var/lib/familycare/import
      FAMILYCARE_ARCHIVE_ROOT: /var/lib/familycare/archive
      FAMILYCARE_WORK_ROOT: /var/lib/familycare/work
      FAMILYCARE_ARCHIVE_MASTER_KEY_FILE: /run/secrets/familycare_archive_master_key
      FAMILYCARE_SECRET_SOCKET: /run/familycare/secret.sock
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY outside Git}
      FAMILYCARE_AI_STRUCTURER_MODEL: ${FAMILYCARE_AI_STRUCTURER_MODEL:-gpt-5.6-luna}
      FAMILYCARE_AI_VERIFIER_MODEL: ${FAMILYCARE_AI_VERIFIER_MODEL:-gpt-5.6-terra}
    group_add:
      - "10003"
    volumes:
      - type: bind
        source: ${FAMILYCARE_IMPORT_ROOT:?set FAMILYCARE_IMPORT_ROOT outside Git}
        target: /var/lib/familycare/import
        read_only: true
      - type: volume
        source: familycare-archive-data
        target: /var/lib/familycare/archive
      - type: volume
        source: familycare-worker-work
        target: /var/lib/familycare/work
      - type: volume
        source: familycare-secret-socket
        target: /run/familycare
      - type: bind
        source: ${FAMILYCARE_ARCHIVE_MASTER_KEY_FILE:?set FAMILYCARE_ARCHIVE_MASTER_KEY_FILE outside Git}
        target: /run/secrets/familycare_archive_master_key
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: familycare-web:dev
    build:
      context: ../..
      dockerfile: infra/containers/web.Dockerfile
    ports:
      - "127.0.0.1:${FAMILYCARE_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  familycare-postgres-data:
  familycare-archive-data:
  familycare-worker-work:
  familycare-secret-socket:
