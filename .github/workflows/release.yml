name: Publish containers

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate semantic version tag
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-semantic tag names
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH"
            exit 1
          fi

  validate-foundation:
    name: Validate release foundation
    needs: validate-tag
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: familycare_release_ci
          POSTGRES_USER: familycare_release
          POSTGRES_PASSWORD: synthetic-release-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U familycare_release -d familycare_release_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FAMILYCARE_DATABASE_URL: postgresql+psycopg://familycare_release:synthetic-release-only-password@127.0.0.1:5432/familycare_release_ci
      FAMILYCARE_TEST_DATABASE_URL: postgresql+psycopg://familycare_release:synthetic-release-only-password@127.0.0.1:5432/familycare_release_ci
      FAMILYCARE_ALLOW_DESTRUCTIVE_TEST_DB: "true"
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan release history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.14.7"
          enable-cache: true
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          uv sync --frozen --all-packages --group dev
          pnpm install --frozen-lockfile
      - name: Validate repository boundaries and contracts
        run: |
          uv run python scripts/check_documentation.py
          uv run python scripts/check_repository_safety.py
          uv run python scripts/check_contracts.py
          uv run python scripts/check_containers.py
          uv run python scripts/check_workflows.py
          uv run python scripts/check_contracts.py --write-openapi
          git diff --exit-code
      - name: Audit release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          uv run python scripts/release_audit.py \
            --version "$RELEASE_VERSION" \
            --commit-sha "$GITHUB_SHA"
      - name: Validate digest-pinned release Compose boundary
        env:
          SYNTHETIC_WEB_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SYNTHETIC_API_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          SYNTHETIC_WORKER_DIGEST: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        run: |
          uv run python scripts/release_compose_smoke.py \
            --web-image "ghcr.io/synthetic/familycare-web@${SYNTHETIC_WEB_DIGEST}" \
            --api-image "ghcr.io/synthetic/familycare-api@${SYNTHETIC_API_DIGEST}" \
            --worker-image "ghcr.io/synthetic/familycare-worker@${SYNTHETIC_WORKER_DIGEST}" \
            --config-check
      - name: Validate Python and database integration
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy apps/api/src workers/analyzer/src scripts
          uv run pytest -q
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run pytest -m integration -q
          uv run alembic -c apps/api/alembic.ini downgrade base
          uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Validate Web
        run: pnpm web:check
      - name: Build Web image without publishing
        run: docker build --file infra/containers/web.Dockerfile --tag familycare-web:validation .
      - name: Build API image without publishing
        run: docker build --file infra/containers/api.Dockerfile --tag familycare-api:validation .
      - name: Build Worker image without publishing
        run: docker build --file infra/containers/worker.Dockerfile --tag familycare-worker:validation .

  publish:
    name: Publish ${{ matrix.name }}
    needs: [validate-tag, validate-foundation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: web
            dockerfile: infra/containers/web.Dockerfile
          - name: api
            dockerfile: infra/containers/api.Dockerfile
          - name: worker
            dockerfile: infra/containers/worker.Dockerfile
    env:
      DOCKER_METADATA_SHORT_SHA_LENGTH: "12"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Derive immutable image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  verify-publication:
    name: Verify published image digests
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.14.7"
          enable-cache: false
      - name: Compare version and commit image tags
        env:
          GHCR_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          uv run --no-sync python scripts/verify_release_images.py \
            --registry ghcr.io \
            --repository "${RELEASE_REPOSITORY,,}" \
            --version "$RELEASE_VERSION" \
            --commit-sha "$GITHUB_SHA"
