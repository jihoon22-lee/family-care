version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      development-dependencies:
        dependency-type: development
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Seoul
    groups:
      development-dependencies:
        dependency-type: development
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directory: /infra/containers
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Seoul
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Seoul
    commit-message:
      prefix: ci
      include: scope
