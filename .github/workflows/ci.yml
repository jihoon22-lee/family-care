name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan committed history and changes
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.14.7"
          enable-cache: true
      - name: Install validation dependencies
        run: uv sync --frozen --all-packages --group dev
      - name: Validate public repository boundaries
        run: |
          uv run python scripts/check_documentation.py
          uv run python scripts/check_repository_safety.py
          uv run python scripts/check_contracts.py
          uv run python scripts/check_containers.py
          uv run python scripts/check_workflows.py
      - name: Validate PR branch and commit subjects
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: uv run python scripts/check_git_conventions.py --branch "$PR_BRANCH" --range "$PR_RANGE"
      - name: Regenerate deterministic contracts
        run: uv run python scripts/check_contracts.py --write-openapi
      - name: Reject generated or formatting drift
        run: git diff --exit-code

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked Web dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Web verification
        run: pnpm web:check

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.14.7"
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --frozen --all-packages --group dev
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Lint Python
        run: uv run ruff check .
      - name: Type-check Python
        run: uv run mypy apps/api/src workers/analyzer/src scripts
      - name: Run unit tests
        run: uv run pytest -q

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: familycare_ci
          POSTGRES_USER: familycare_ci
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U familycare_ci -d familycare_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FAMILYCARE_DATABASE_URL: postgresql+psycopg://familycare_ci:synthetic-ci-only-password@127.0.0.1:5432/familycare_ci
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.14.7"
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --frozen --all-packages --group dev
      - name: Apply migration baseline
        run: uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Run database-backed tests
        run: uv run pytest -m integration -q
      - name: Validate shared contracts
        run: uv run python scripts/check_contracts.py
      - name: Verify reversible migration baseline
        run: |
          uv run alembic -c apps/api/alembic.ini downgrade base
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini current

  containers:
    name: Container (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: web
            dockerfile: infra/containers/web.Dockerfile
          - name: api
            dockerfile: infra/containers/api.Dockerfile
          - name: worker
            dockerfile: infra/containers/worker.Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: familycare-${{ matrix.name }}:ci
      - name: Smoke local OCR languages
        if: matrix.name == 'worker'
        run: |
          available_languages="$(docker run --rm familycare-worker:ci tesseract --list-langs)"
          grep -Fxq 'eng' <<<"${available_languages}"
          grep -Fxq 'kor' <<<"${available_languages}"
